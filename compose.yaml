services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: poker
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - poker_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker -d poker"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  poker_data:
